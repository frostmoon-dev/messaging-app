<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06112a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef3fb" media="(prefers-color-scheme: light)" />
    <title>Offline · HEARTLINE</title>
    <style>
      :root{--bg:#06112a;--fg:#f3f8ff;--muted:#cad8f0;--accent:#45d4ff;--on-accent:#04122b;--focus:#ffe14d;color-scheme:dark}
      @media (prefers-color-scheme: light){:root{--bg:#eef3fb;--fg:#081634;--muted:#2d3f63;--accent:#0a55d1;--on-accent:#fff;--focus:#b35c00;color-scheme:light}}
      html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
      img{width:64px;height:64px;border-radius:14px}
      h1{font-size:28px;line-height:1.2;font-weight:800;margin:20px 0 8px}
      p{color:var(--muted);max-width:300px;margin:0 auto 24px;line-height:1.5;font-size:16px}
      button{font:700 16px/1 inherit;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;min-height:44px;padding:0 24px;cursor:pointer}
      button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Your messages are safe. They load again when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
