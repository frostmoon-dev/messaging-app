<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f0ec" media="(prefers-color-scheme: light)" />
    <title>Offline · Napyru</title>
    <style>
      :root{--bg:#141416;--fg:#eceaef;--muted:#d3d0d7;--accent:#d42840;--on-accent:#fff;--focus:#ffd83d;color-scheme:dark}
      @media (prefers-color-scheme: light){:root{--bg:#f2f0ec;--fg:#1b1a1e;--muted:#3a383f;--accent:#c42238;--on-accent:#fff;--focus:#1a4fd6;color-scheme:light}}
      html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
      img{width:64px;height:64px;clip-path:polygon(6% 0,100% 4%,94% 100%,0 95%)}
      h1{font-size:28px;line-height:1.2;font-weight:800;margin:20px 0 8px}
      p{color:var(--muted);max-width:300px;margin:0 auto 24px;line-height:1.5;font-size:16px}
      button{font:700 16px/1 inherit;background:var(--accent);color:var(--on-accent);border:0;min-height:44px;padding:0 28px;cursor:pointer;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
      button:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Your messages are safe. They load again when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
