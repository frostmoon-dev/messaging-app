<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · HEARTLINE</title>
    <style>
      :root{--bg:#111113;--fg:#f2f0ed;--muted:#a19ea6;--accent:#d0243a;--focus:#f2f0ed}
      @media (prefers-color-scheme: light){:root{--bg:#f6f4f1;--fg:#1a181c;--muted:#5c5862;--accent:#c21a30;--focus:#1a181c}}
      html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
        font:16px/1.5 "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
      img{width:56px;height:56px;border-radius:14px;margin-bottom:24px}
      h1{font-size:28px;line-height:1.2;margin:0 0 8px}
      p{color:var(--muted);max-width:300px;margin:0 auto 24px}
      button{font:600 16px/1 inherit;font-family:inherit;background:var(--accent);color:#fff;border:0;border-radius:10px;
        min-height:44px;padding:0 20px;cursor:pointer}
      button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Your messages are safe. They will load again when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
