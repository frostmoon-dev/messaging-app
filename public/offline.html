<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040a17" />
    <title>Offline · HEARTLINE</title>
    <style>
      html,body{height:100%;margin:0;background:#040a17;color:#eaf4ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
        background-image:repeating-linear-gradient(-58deg,transparent 0 22px,rgba(227,22,47,.06) 22px 24px)}
      h1{font:900 44px/1 Impact,"Arial Narrow Bold",sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px;
        display:inline-block;background:#eaf4ff;color:#040a17;padding:6px 14px;transform:rotate(-3deg)}
      p{color:#b6c8e6;max-width:280px;margin:16px auto 24px;line-height:1.5}
      button{font:900 16px Impact,sans-serif;letter-spacing:.15em;text-transform:uppercase;background:#2fc5ff;color:#03101f;border:0;
        min-height:44px;padding:0 28px;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);cursor:pointer}
      button:focus-visible{outline:2px solid #ffe14d;outline-offset:3px}
    </style>
  </head>
  <body>
    <main>
      <h1>Off the grid</h1>
      <p>No connection right now. Your messages are safe — they'll be here when you're back.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
